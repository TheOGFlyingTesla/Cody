name: CI

on:
  push:
  pull_request:

concurrency:
  group: cody-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11']

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run test suite
        run: python -m unittest discover -s tests -p 'test_*.py'

  windows-preview:
    name: Windows read-only preview
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Prove inspection and fail-closed mutation
        shell: python
        run: |
          import json
          import subprocess
          import sys

          def run_json(*arguments):
              completed = subprocess.run(
                  [sys.executable, *arguments],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
              print(completed.stdout)
              if completed.stderr:
                  print(completed.stderr, file=sys.stderr)
              return completed, json.loads(completed.stdout)

          inspection, inspection_payload = run_json(
              "scripts/coordinator_standard.py", "--repo", ".", "--format", "json", "inspect"
          )
          assert inspection.returncode == 0
          assert inspection_payload["ok"] is True

          mutation, mutation_payload = run_json(
              "scripts/coordinator_standard.py", "--repo", ".", "--format", "json", "init"
          )
          assert mutation.returncode == 2
          assert mutation_payload["blockers"][0]["code"] == "unsupported_platform"

          install, install_payload = run_json(
              "scripts/install_skill.py", "--release-root", ".", "--check"
          )
          assert install.returncode == 2
          assert install_payload["code"] == "unsupported_platform"

          archive, archive_payload = run_json(
              "scripts/quick_validate.py", "--release-root", "."
          )
          assert archive.returncode == 2
          assert "unsupported on this platform" in archive_payload["error"]
